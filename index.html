<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>모임 경비 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141416);--ink:light-dark(#1c1b1f,#efedf0);--mute:light-dark(#6b6872,#a29fa8);--line:light-dark(#e6e3e8,#2e2d33);--card:light-dark(#ffffff,#1c1c20);--paper:light-dark(#faf8f4,#222226);--acc:#ff5a36;--chip:light-dark(#f2f0f3,#29282e);--pos:light-dark(#1f6fd1,#6aa8ff);--neg:light-dark(#d23a1c,#ff7d62);--ok:light-dark(#1f8a4c,#4cc985)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{background:var(--acc);color:#fff;padding:calc(16px + env(safe-area-inset-top)) max(5vw,16px) 18px}
.top .in{max-width:1240px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.hl{display:flex;align-items:center;gap:10px;min-width:0}
h1{font:400 clamp(26px,5vw,40px)/1.1 "Black Han Sans",sans-serif;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ghost{min-height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.75);background:transparent;color:#fff;padding:0 12px;font-weight:700;white-space:nowrap}
.back{min-height:44px;border:0;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-weight:700;padding:0 12px;white-space:nowrap}
.sync{font-size:13px;opacity:.95;max-width:1240px;margin:6px auto 0}
.wrap{max-width:1240px;margin:auto;padding:20px max(5vw,16px) 40px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h2{font-size:20px;margin:0 0 12px;font-weight:700}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:3px solid var(--ink);padding-bottom:4px}
.amt input{flex:1;border:0;background:transparent;font:400 clamp(34px,7vw,48px)/1.1 "Black Han Sans",sans-serif;padding:0;outline:0;text-align:right}
.amt span{font-weight:700;font-size:20px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px;justify-content:flex-end}
.quick button{min-height:36px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:0 12px;font-size:14px}
label.f{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px;font-weight:500}
.txt{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg);font-size:16px}
select.txt{padding:0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:0 14px;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.go{margin-top:18px;display:flex;gap:8px}
.go button{min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:17px}
#save{flex:1;background:var(--acc);color:#fff}#cancel{padding:0 18px;background:var(--chip)}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0;min-height:1.4em;overflow-wrap:anywhere}.hint.err{color:var(--neg)}
.plbtn{width:100%;min-height:52px;border-radius:14px;border:2px dashed var(--acc);background:transparent;color:var(--acc);font-weight:700;font-size:16px;margin-bottom:14px}
.plsel{display:flex;gap:10px;align-items:center;border:2px solid var(--acc);border-radius:14px;padding:10px 6px 10px 14px;margin-bottom:14px}
.plsel div{flex:1}.plsel b{display:block}.plsel small{color:var(--mute);font-size:13px}
.plsel button{width:40px;height:40px;border:0;border-radius:10px;background:var(--chip)}
.plpanel{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px;background:var(--paper)}
.inl{display:flex;gap:8px}.inl .txt{flex:1}
.btn{min-height:46px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);padding:0 16px;font-weight:700;white-space:nowrap}
.btn.acc{background:var(--acc);color:#fff}.btn.light{background:var(--chip);color:var(--ink)}.btn.danger{background:transparent;color:var(--neg);border:1.5px solid var(--neg)}
.plcats{margin:10px 0}.plcats .chip{min-height:36px;font-size:14px;padding:0 12px}
.map{position:relative;height:230px;border-radius:12px;overflow:hidden;background:var(--chip)}
.map .me{position:absolute;right:8px;bottom:8px;z-index:3;min-height:38px;border:0;border-radius:10px;background:#fff;color:#1c1b1f;font-weight:700;padding:0 12px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:14px}
.res{max-height:330px;overflow:auto;margin-top:8px}
.res button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;min-height:52px}
.res button:hover{background:var(--chip)}
.res .n{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.res b{display:block;font-weight:700}.res small{color:var(--mute);font-size:13px}
.pin{background:var(--acc);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font:700 12px/1 "Noto Sans KR",sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.medot{width:16px;height:16px;border-radius:50%;background:#1f6fd1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,111,209,.25)}
.lhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.lhead .txt{max-width:220px}
.day{font-size:13px;color:var(--mute);font-weight:700;margin:16px 0 4px}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;background:var(--chip);border-radius:6px;padding:2px 7px;white-space:nowrap}
.ex b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex small{color:var(--mute);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex small a{color:var(--acc)}
.ex .m{font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ex .act{display:flex;gap:2px}
.ex .act button{width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:var(--mute)}
.ex .act button:hover{background:var(--chip);color:var(--ink)}
.receipt{position:sticky;top:16px;background:var(--paper);padding:22px 20px 36px;border-radius:6px 6px 0 0;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,radial-gradient(circle at 10px 0,transparent 7px,#000 7.5px) bottom/20px 12px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,radial-gradient(circle at 10px 0,transparent 7px,#000 7.5px) bottom/20px 12px repeat-x}
.rc-t{text-align:center;font-size:13px;color:var(--mute);letter-spacing:1px}
.rc-name{text-align:center;font-weight:700;font-size:18px;margin:2px 0 10px}
.dash{border:0;border-top:2px dashed var(--line);margin:14px 0}
.total{text-align:center;font:400 clamp(36px,6vw,52px)/1.05 "Black Han Sans",sans-serif;white-space:nowrap}
.per{text-align:center;margin-top:10px}
.per b{font:400 clamp(28px,5vw,38px)/1.1 "Black Han Sans",sans-serif;color:var(--acc);white-space:nowrap}
.sub{text-align:center;color:var(--mute);font-size:13px;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mute);text-align:right;padding:4px 0;font-size:13px}
th:first-child,td:first-child{text-align:left}
td{padding:6px 0;text-align:right;white-space:nowrap;border-top:1px solid var(--line);vertical-align:middle}
td.c,th.c{text-align:center;width:64px}
.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}
.ck{min-height:36px;min-width:56px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-size:13px;font-weight:700;color:var(--mute)}
.ck[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.prog{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:10px 0 4px}.prog i{display:block;height:100%;background:var(--ok)}
.rc-h{font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rc-h select{min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;padding:0 6px}
.acct{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px 10px 12px;font-size:14px;margin-bottom:10px}.acct div{flex:1;overflow-wrap:anywhere}.acct small{display:block;color:var(--mute);font-size:12px}.acct b{font-size:16px;font-variant-numeric:tabular-nums}.acct button{min-height:40px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;padding:0 12px;white-space:nowrap}
.memo{min-height:84px;padding:10px 14px;resize:vertical;line-height:1.5;font-family:inherit}
.tm{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--ink);color:var(--bg);margin-left:4px;vertical-align:1px}
tr.grp td{border-top:0;padding:12px 0 2px;font-size:12px;color:var(--mute);font-weight:700}
.incl{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:12px;min-height:40px;cursor:pointer}.incl input{width:20px;height:20px;accent-color:var(--acc)}
.note{background:light-dark(#fff3ef,#3a2420);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;margin:-2px 0 10px;overflow-wrap:anywhere}
.acgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr) minmax(0,.8fr);gap:8px}@media(max-width:600px){.acgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.acgrid input:nth-child(2){grid-column:1/-1;grid-row:1}}
.done{text-align:center;color:var(--mute);padding:10px 0}
.bars .b{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bars .t{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--acc)}
.copy{width:100%;min-height:48px;margin-top:14px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:700}
.fin{width:100%;min-height:48px;margin-top:8px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);font-weight:700}
.panel{max-width:1240px;margin:0 auto;padding:0 max(5vw,16px)}
.panel .card{margin-top:16px;border:2px solid var(--acc)}
.panel .inl{margin-top:10px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:2px;background:var(--chip);border-radius:999px;padding-left:14px;min-height:40px}
.mchip button{width:36px;height:36px;border:0;background:transparent;border-radius:50%;color:var(--mute)}
.donebar{max-width:1240px;margin:16px auto 0;padding:0 max(5vw,16px)}
.donebar div{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--chip);border-radius:14px;padding:12px 14px;font-weight:700}
/* 홈 */
.home{max-width:820px;margin:auto;padding:22px max(5vw,16px) 60px}
.gcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;min-height:72px}
.gcard:hover{border-color:var(--acc)}
.gcard b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard small{color:var(--mute);font-size:13px}
.gcard .gr{text-align:right;white-space:nowrap}.gcard .gr b{font-size:16px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--acc);color:#fff}
.badge.dn{background:var(--chip);color:var(--mute)}
.badge svg{width:11px;height:11px}
.sec{font-size:14px;color:var(--mute);font-weight:700;margin:22px 0 8px}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line);align-items:center}
.foot label{cursor:pointer}
.empty{text-align:center;padding:30px 0}.empty p{color:var(--mute)}
/* 비밀번호 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}
.pinbox{background:var(--card);border-radius:22px;padding:22px 20px;width:min(340px,100%);text-align:center}
.pinbox .pt{font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinbox .ps{color:var(--mute);font-size:14px}
.dots{display:flex;gap:14px;justify-content:center;margin:18px 0 4px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}.dots i.on{background:var(--ink)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}.shake{animation:shake .3s}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 12px}
.pad button{min-height:56px;border:0;border-radius:14px;background:var(--chip);font-size:22px;font-weight:700}
.pad button:empty{visibility:hidden}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;z-index:40;min-height:44px}
.toast button{min-height:40px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;padding:0 14px}
.tabs{display:none}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}.flash{animation:pop .35s ease}
@media(prefers-reduced-motion:reduce){.flash,.shake{animation:none}}
@media(max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);padding-bottom:110px}.receipt{position:static}
  body[data-tab=in] #tList,body[data-tab=in] #tRc,body[data-tab=list] #tIn,body[data-tab=list] #tRc,body[data-tab=rc] #tIn,body[data-tab=rc] #tList{display:none}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
  .tabs button{min-height:52px;border:0;background:transparent;border-radius:12px;font-weight:700;color:var(--mute)}
  .tabs button[aria-current=true]{color:var(--acc);background:var(--chip)}
}
@media(max-width:600px){.ex{grid-template-columns:minmax(0,1fr) auto auto}.ex .tag{display:none}.card{padding:14px}.row2{grid-template-columns:minmax(0,1fr)}.lhead .txt{max-width:none;flex:1}h1{font-size:26px}}
</style>
</head>
<body data-tab="in">
<header class="top">
  <div class="in">
    <div class="hl"><button class="back" id="bBack" hidden>← 목록</button><h1 id="hTitle">모임 경비 정산</h1></div>
    <div class="gbar"><button class="ghost" id="bNew">+ 새 모임</button><button class="ghost" id="bSet" hidden>설정</button></div>
  </div>
  <div class="sync" id="sync">불러오는 중…</div>
</header>

<div class="panel" id="pNew" hidden><div class="card">
  <h2>새 모임 만들기</h2>
  <div class="row2">
    <div><label class="f" for="nName">모임 이름</label><input class="txt" id="nName" placeholder="예: 11월 정기모임, 제주 여행"></div>
    <div><label class="f" for="nDate">날짜</label><input class="txt" id="nDate" type="date"></div>
  </div>
  <label class="f" for="nMem">개인 참여자 <span style="font-weight:400">(이름을 쉼표나 띄어쓰기로 구분)</span></label><input class="txt" id="nMem" placeholder="예: 찐이, 민수, 지영, 현우">
  <label class="f">단체 <span style="font-weight:400">(선택 · 단체명과 인원수 — 인원수만큼 1/n 부담)</span></label>
  <div class="inl" style="margin-top:0"><input class="txt" id="nTeam" placeholder="단체명 (예: 산악회, 3팀)"><input class="txt" id="nTeamN" type="number" inputmode="numeric" min="1" max="999" placeholder="인원" style="flex:0 0 84px"><button type="button" class="btn" id="nTeamB">추가</button></div>
  <div class="chips" id="nTeams" style="margin-top:8px"></div>
  <div class="row2">
    <div><label class="f" for="nTre">총무</label><select class="txt" id="nTre"><option value="">참여자를 먼저 입력</option></select></div>
    <div><label class="f" for="nPin">비밀번호 (숫자 4자리)</label><input class="txt" id="nPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"></div>
  </div>
  <label class="f">입금받을 계좌 <span style="font-weight:400">(선택 · 정산 문구에 표시)</span></label>
  <div class="acgrid"><input class="txt" id="nBank" list="bankList" placeholder="은행"><input class="txt" id="nNo" inputmode="numeric" placeholder="계좌번호 (예: 3333-01-2345678)"><input class="txt" id="nHolder" placeholder="예금주"></div>
  <label class="f" for="nNote">입금 안내 문구 <span style="font-weight:400">(선택 · 정산 문구에 표시)</span></label><input class="txt" id="nNote" maxlength="80" placeholder="예: 카톡으로 송금해 주세요 / 토스 송금 OK / 27일까지">
  <div class="inl"><button class="btn acc" id="nOk">만들기</button><button class="btn light" id="nNo">닫기</button></div>
  <p class="hint" id="nHint">목록에서 이 모임을 열 때 비밀번호를 물어봐요.</p>
</div></div>

<div class="panel" id="pSet" hidden><div class="card">
  <h2>모임 설정</h2>
  <div class="row2">
    <div><label class="f" for="sName">모임 이름</label><input class="txt" id="sName"></div>
    <div><label class="f" for="sDate">날짜</label><input class="txt" id="sDate" type="date"></div>
  </div>
  <label class="f" for="sTre">총무</label><select class="txt" id="sTre" style="max-width:320px"></select>
  <label class="f">입금받을 계좌 <span style="font-weight:400">(선택 · 정산 문구에 표시)</span></label>
  <div class="acgrid"><input class="txt" id="sBank" list="bankList" placeholder="은행"><input class="txt" id="sNo" inputmode="numeric" placeholder="계좌번호 (예: 3333-01-2345678)"><input class="txt" id="sHolder" placeholder="예금주"></div>
  <label class="f" for="sNote">입금 안내 문구 <span style="font-weight:400">(선택 · 정산 문구에 표시)</span></label><input class="txt" id="sNote" maxlength="80" placeholder="예: 카톡으로 송금해 주세요 / 토스 송금 OK / 27일까지">
  <div class="inl"><button class="btn acc" id="sSave">저장</button></div>

function localStore(){

    list(cb){const f=()=>cb(Object.values(D.g).map(g=>({...g,total:sum(g.id)})));subs.add(f);f();return()=>subs.delete(f)},
    sub(gid,onG,onE){const f=()=>{onG(D.g[gid]?{...D.g[gid]}:null);onE({...(D.e[gid]||{})})};subs.add(f);f();return()=>subs.delete(f)},
    putGroup:async g=>{D.g[g.id]=clean(g);save()},
    patchGroup:async(gid,p)=>{if(D.g[gid]){D.g[gid]={...D.g[gid],...clean(p)};save()}},
    putExp:async(gid,x)=>{(D.e[gid]=D.e[gid]||{})[x.id]=clean(x);save()},
    delExp:async(gid,id)=>{if(D.e[gid])delete D.e[gid][id];save()},

    load(d){Object.assign(D.g,d.g||{});for(const k in d.e||{})D.e[k]={...(D.e[k]||{}),...d.e[k]};save()}};
}

/* ---------- 정산 계산 (1/n) ---------- */
function settle(g,list){
  const m=g.members||[],n=heads(g),tre=treOf(g),u=g.unit||100,paid={},cat={};let total=0;
  m.forEach(p=>paid[p]=0);
  list.forEach(x=>{total+=x.amount;paid[x.payer in paid?x.payer:tre]+=x.amount;const c=x.cat||'기타';cat[c]=(cat[c]||0)+x.amount});
  const raw=n?total/n:0,share=n?Math.ceil(raw/u-1e-9)*u:0;
  const rows=m.map(p=>({p,size:sizeOf(g,p),team:isTeam(g,p),paid:paid[p],send:p===tre?share*(sizeOf(g,p)-1)-0:share*sizeOf(g,p)-paid[p],tre:p===tre})).map(r=>r.tre?{...r,send:0}:r).sort((a,b)=>(b.tre-a.tre)||(a.team-b.team));
  return{m,n,tre,u,total,raw,share,rows,surplus:share*n-total,cat};
}

let nTeams={};
const teamChips=()=>{$('#nTeams').innerHTML=Object.entries(nTeams).map(([k,v])=>`<span class="mchip">${esc(k)}<span class="tm">${v}명</span><button type="button" data-k="${esc(k)}" aria-label="${esc(k)} 빼기">✕</button></span>`).join('');$('#nTeams').querySelectorAll('button').forEach(b=>b.onclick=()=>{delete nTeams[b.dataset.k];teamChips()})};
const readTeam=p=>{const nm=$('#'+p+'Team').value.trim().replace(/[,]/g,' ').slice(0,16),n=parseInt($('#'+p+'TeamN').value,10);if(!nm||!(n>=1&&n<=999))return null;$('#'+p+'Team').value='';$('#'+p+'TeamN').value='';return[nm,n]};
$('#nTeamB').onclick=()=>{const t=readTeam('n');if(!t){$('#nHint').className='hint err';$('#nHint').textContent='단체명과 인원수(1~999)를 넣어 주세요.';return}nTeams[t[0]]=t[1];teamChips();$('#nTeam').focus()};
['#nTeam','#nTeamN'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#nTeamB').click()}}));
$('#nMem').addEventListener('input',()=>{const m=parseMem($('#nMem').value),v=$('#nTre').value;$('#nTre').innerHTML=m.length?m.map(p=>`<option>${esc(p)}</option>`).join(''):'<option value="">참여자를 먼저 입력</option>';if(m.includes(v))$('#nTre').value=v});
$('#nOk').onclick=()=>{const name=$('#nName').value.trim(),solo=parseMem($('#nMem').value).filter(x=>!(x in nTeams)),m=[...solo,...Object.keys(nTeams)],sizes={...nTeams},hc=solo.length+Object.values(nTeams).reduce((a,b)=>a+b,0),pin=$('#nPin').value.trim(),h=$('#nHint');h.className='hint err';
  if(!name){h.textContent='모임 이름을 넣어 주세요.';return}if(!solo.length){h.textContent='총무를 포함해 개인 참여자를 1명 이상 넣어 주세요.';return}if(hc<2){h.textContent='참여 인원이 2명 이상이어야 해요.';return}if(m.length>60){h.textContent='참여자(개인+단체)는 60개까지 넣을 수 있어요.';return}if(!pinOk(pin)){h.textContent='비밀번호는 숫자 4자리로 넣어 주세요.';return}
  const g={id:rid(20),name:name.slice(0,40),date:$('#nDate').value||today(),members:m,sizes,treasurer:solo.includes($('#nTre').value)?$('#nTre').value:solo[0],pin,unit:100,status:'open',checks:{},...readAcct('n'),total:0,count:0,created:Date.now()};
  ['#nName','#nMem','#nPin','#nBank','#nNo','#nHolder','#nNote'].forEach(s=>$(s).value='');nTeams={};teamChips();$('#nDate').value='';$('#nTre').innerHTML='<option value="">참여자를 먼저 입력</option>';$('#pNew').hidden=true;
  run(S.putGroup(g)).then(()=>openGroup(g.id))};
function demo(){const d=today(),g={id:rid(20),name:'11월 정기모임 (예시)',date:d,members:['찐이','민수','지영','현우','수진','등산동호회'],sizes:{'등산동호회':4},treasurer:'찐이',pin:'0000',unit:100,status:'open',checks:{'민수':true},bank:'카카오뱅크',acctNo:'3333-00-0000000',holder:'찐이',note:'카톡으로 송금해 주세요',created:Date.now()};
  const X=[['1차 삼겹살',312000,'찐이','식비'],['2차 호프',142500,'찐이','술·카페'],['노래방',44000,'민수','입장·체험'],['대리운전',25000,'찐이','교통']];
  const e={};X.forEach((s,k)=>{const id=rid(16);e[id]={id,title:s[0],amount:s[1],payer:s[2],cat:s[3],date:d,place:null,ts:Date.now()+k}});
  g.total=X.reduce((s,x)=>s+x[1],0);g.count=X.length;
  run((async()=>{await S.putGroup(g);for(const x of Object.values(e))await S.putExp(g.id,x)})()).then(()=>toast('예시 모임을 만들었어요. 비밀번호는 0000이에요.'))}
function renderSet(){const g=group;if(!g)return;const used=new Set(gExps().map(x=>x.payer));
  $('#sCnt').textContent=`· ${headStr(g)}`;
  $('#sMem').innerHTML=(g.members||[]).map((p,k)=>`<span class="mchip">${esc(p)}${isTeam(g,p)?`<span class="tm">${sizeOf(g,p)}명</span>`:''}<button data-k="${k}" aria-label="${esc(p)} 빼기">✕</button></span>`).join('');
  $('#sMem').querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=g.members[+b.dataset.k],h=$('#sHint');h.className='hint err';
    if(heads(g)-sizeOf(g,p)<2){h.textContent='참여 인원은 2명 이상이어야 해요.';return}
    if(used.has(p)){h.textContent=`${p} 님이 결제한 지출이 있어 뺄 수 없어요. 해당 지출의 결제자를 먼저 바꾸세요.`;return}
    if(p===treOf(g)){h.textContent='총무는 뺄 수 없어요. 총무를 먼저 바꾸세요.';return}
    const c={...(g.checks||{})},z={...(g.sizes||{})};delete c[p];delete z[p];run(S.patchGroup(cur,{members:g.members.filter(x=>x!==p),checks:c,sizes:z}))})}
function fillSet(){const g=group;$('#sName').value=g.name;$('#sDate').value=g.date||'';{const a=acctOf(g)||{};$('#sBank').value=a.bank||'';$('#sNo').value=a.no||'';$('#sHolder').value=a.holder||'';$('#sNote').value=g.note||''}$('#sPin').value='';
  $('#sTre').innerHTML=g.members.filter(p=>!isTeam(g,p)).map(p=>`<option>${esc(p)}</option>`).join('');$('#sTre').value=treOf(g);$('#sHint').textContent='';$('#sDel').dataset.arm='';$('#sDel').textContent='모임 삭제';renderSet()}
$('#bSet').onclick=()=>{const p=$('#pSet');p.hidden=!p.hidden;if(!p.hidden)fillSet()};
$('#sClose').onclick=()=>$('#pSet').hidden=true;
$('#sSave').onclick=()=>{const n=$('#sName').value.trim();if(!n){$('#sHint').className='hint err';$('#sHint').textContent='모임 이름을 넣어 주세요.';return}
  run(S.patchGroup(cur,{name:n.slice(0,40),date:$('#sDate').value||group.date||today(),treasurer:$('#sTre').value,...readAcct('s'),account:''})).then(()=>{$('#sHint').className='hint';$('#sHint').textContent='저장했어요.'})};
const addMem=()=>{const g=group,add=parseMem($('#sAdd').value).filter(x=>!g.members.includes(x));if(!add.length)return;$('#sAdd').value='';run(S.patchGroup(cur,{members:[...g.members,...add].slice(0,60)})).then(fillSet)};
$('#sTeamB').onclick=()=>{const t=readTeam('s'),h=$('#sHint');if(!t){h.className='hint err';h.textContent='단체명과 인원수(1~999)를 넣어 주세요.';return}const g=group;if(g.members.includes(t[0])&&!isTeam(g,t[0])){h.className='hint err';h.textContent='같은 이름의 개인 참여자가 있어요.';return}
  run(S.patchGroup(cur,{members:g.members.includes(t[0])?g.members:[...g.members,t[0]],sizes:{...(g.sizes||{}),[t[0]]:t[1]}})).then(()=>{fillSet();h.className='hint';h.textContent=`${t[0]} ${t[1]}명으로 저장했어요.`})};
['#sTeam','#sTeamN'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#sTeamB').click()}}));
$('#sAddB').onclick=addMem;$('#sAdd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addMem()}});
$('#sPinB').onclick=()=>{const v=$('#sPin').value.trim(),h=$('#sHint');if(!pinOk(v)){h.className='hint err';h.textContent='비밀번호는 숫자 4자리로 넣어 주세요.';return}
  run(S.patchGroup(cur,{pin:v})).then(()=>{$('#sPin').value='';h.className='hint';h.textContent='비밀번호를 바꿨어요.'})};
$('#sDel').onclick=e=>{const b=e.currentTarget;if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='한 번 더 누르면 지출까지 모두 삭제돼요';return}
  const id=cur,ids=Object.keys(exps);$('#pSet').hidden=true;goHome();run(S.delGroup(id,ids)).then(()=>toast('모임을 삭제했어요.'))};

/* ---------- 백업 ---------- */
$('#bBak').onclick=()=>{try{const blob=new Blob([JSON.stringify(S.dump(),null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`모임정산-백업-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}catch(e){toast('백업 파일을 만들지 못했어요.')}};
$('#bRes').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(!d||typeof d.g!=='object')throw 0;S.load(d);toast('백업을 불러왔어요.')}catch(_){toast('올바른 백업 파일이 아니에요.')}};

/* ---------- 시작 ---------- */
(async()=>{
  if(C.FIREBASE&&C.FIREBASE.projectId){try{S=await cloudStore(C.FIREBASE)}catch(e){console.error(e)}}
  if(!S)S=localStore();
  let pend=ss.get('ms-open');render();
  S.list(l=>{glist=l;if(pend&&!cur){const f=l.find(g=>g.id===pend);pend=null;if(f){openGroup(f.id);return}}if(!cur)render()},err=>{console.error(err);toast('목록을 불러오지 못했어요.')});
})();
</script>
</body>
</html>
