<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>모임 경비 정산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141416);--ink:light-dark(#1c1b1f,#efedf0);--mute:light-dark(#6b6872,#a29fa8);--line:light-dark(#e6e3e8,#2e2d33);--card:light-dark(#ffffff,#1c1c20);--paper:light-dark(#faf8f4,#222226);--acc:#ff5a36;--chip:light-dark(#f2f0f3,#29282e);--pos:light-dark(#1f6fd1,#6aa8ff);--neg:light-dark(#d23a1c,#ff7d62)}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.top{background:var(--acc);color:#fff;padding:calc(16px + env(safe-area-inset-top)) max(5vw,16px) 18px}
.top .in{max-width:1240px;margin:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{font:400 clamp(26px,5vw,40px)/1.05 "Black Han Sans",sans-serif;margin:0}
.gbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gbar select{min-height:44px;border-radius:12px;border:0;padding:0 12px;background:#fff;color:#1c1b1f;font-weight:700;max-width:58vw}
.ghost{min-height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.75);background:transparent;color:#fff;padding:0 12px;font-weight:700}
.sync{font-size:13px;opacity:.92;max-width:1240px;margin:6px auto 0}
.wrap{max-width:1240px;margin:auto;padding:20px max(5vw,16px) 40px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
h2{font-size:20px;margin:0 0 12px;font-weight:700}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:3px solid var(--ink);padding-bottom:4px}
.amt input{flex:1;border:0;background:transparent;font:400 clamp(34px,7vw,48px)/1.1 "Black Han Sans",sans-serif;padding:0;outline:0;text-align:right}
.amt span{font-weight:700;font-size:20px}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px;justify-content:flex-end}
.quick button{min-height:36px;border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:0 12px;font-size:14px}
label.f{display:block;font-size:14px;color:var(--mute);margin:14px 0 6px;font-weight:500}
.txt{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg);font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:0 14px;font-size:15px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.chip.all{border-style:dashed}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.go{margin-top:18px;display:flex;gap:8px}
.go button{min-height:52px;border-radius:14px;border:0;font-weight:700;font-size:17px}
#save{flex:1;background:var(--acc);color:#fff}#cancel{padding:0 18px;background:var(--chip)}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0;min-height:1.4em;overflow-wrap:anywhere}.hint.err{color:var(--neg)}
/* 장소 */
.plbtn{width:100%;min-height:52px;border-radius:14px;border:2px dashed var(--acc);background:transparent;color:var(--acc);font-weight:700;font-size:16px;margin-bottom:14px}
.plsel{display:flex;gap:10px;align-items:center;border:2px solid var(--acc);border-radius:14px;padding:10px 6px 10px 14px;margin-bottom:14px}
.plsel div{flex:1}.plsel b{display:block}.plsel small{color:var(--mute);font-size:13px}
.plsel button{width:40px;height:40px;border:0;border-radius:10px;background:var(--chip)}
.plpanel{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:14px;background:var(--paper)}
.inl{display:flex;gap:8px}.inl .txt{flex:1}
.btn{min-height:46px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);padding:0 16px;font-weight:700;white-space:nowrap}
.btn.light{background:var(--chip);color:var(--ink)}.btn.danger{background:transparent;color:var(--neg);border:1.5px solid var(--neg)}
.plcats{margin:10px 0}.plcats .chip{min-height:36px;font-size:14px;padding:0 12px}
.map{position:relative;height:230px;border-radius:12px;overflow:hidden;background:var(--chip)}
.map .me{position:absolute;right:8px;bottom:8px;z-index:3;min-height:38px;border:0;border-radius:10px;background:#fff;color:#1c1b1f;font-weight:700;padding:0 12px;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:14px}
.res{max-height:330px;overflow:auto;margin-top:8px}
.res button{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;min-height:52px}
.res button:hover{background:var(--chip)}
.res .n{width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.res b{display:block;font-weight:700}.res small{color:var(--mute);font-size:13px}
.pin{background:var(--acc);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font:700 12px/1 "Noto Sans KR",sans-serif;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.medot{width:16px;height:16px;border-radius:50%;background:#1f6fd1;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,111,209,.25)}
/* 내역 */
.lhead{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:6px}
.lhead .inl{flex:1;justify-content:flex-end}.lhead .txt{max-width:220px}
.day{font-size:13px;color:var(--mute);font-weight:700;margin:16px 0 4px}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;background:var(--chip);border-radius:6px;padding:2px 7px;white-space:nowrap}
.ex b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex small{color:var(--mute);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex small a{color:var(--acc)}
.ex .m{font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ex .act{display:flex;gap:2px}
.ex .act button{width:40px;height:40px;border:0;background:transparent;border-radius:10px;color:var(--mute)}
.ex .act button:hover{background:var(--chip);color:var(--ink)}
/* 영수증 */
.receipt{position:sticky;top:16px;background:var(--paper);padding:22px 20px 36px;border-radius:6px 6px 0 0;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);-webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,radial-gradient(circle at 10px 0,transparent 7px,#000 7.5px) bottom/20px 12px repeat-x;mask:linear-gradient(#000 0 0) top/100% calc(100% - 12px) no-repeat,radial-gradient(circle at 10px 0,transparent 7px,#000 7.5px) bottom/20px 12px repeat-x}
.rc-t{text-align:center;font-size:13px;color:var(--mute);letter-spacing:1px}
.rc-name{text-align:center;font-weight:700;font-size:18px;margin:2px 0 10px}
.dash{border:0;border-top:2px dashed var(--line);margin:14px 0}
.total{text-align:center;font:400 clamp(36px,6vw,52px)/1.05 "Black Han Sans",sans-serif;white-space:nowrap}
.sub{text-align:center;color:var(--mute);font-size:14px;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--mute);text-align:right;padding:4px 0;font-size:13px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 0;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
.pos{color:var(--pos);font-weight:700}.neg{color:var(--neg);font-weight:700}
.tr{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.tr .who{flex:1;font-weight:700}.tr .who i{font-style:normal;color:var(--acc);margin:0 6px}.tr .m{font-weight:700;white-space:nowrap}
.rc-h{font-weight:700;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc-h select{min-height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;padding:0 6px}
.done{text-align:center;color:var(--mute);padding:10px 0}
.bars .b{display:grid;grid-template-columns:5.5em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bars .t{height:10px;background:var(--chip);border-radius:5px;overflow:hidden}.bars .t i{display:block;height:100%;background:var(--acc)}
.copy{width:100%;min-height:48px;margin-top:14px;border-radius:12px;border:2px solid var(--ink);background:transparent;font-weight:700}
.panel{max-width:1240px;margin:0 auto;padding:0 max(5vw,16px)}
.panel .card{margin-top:16px;border:2px solid var(--acc)}
.panel .inl{margin-top:10px;flex-wrap:wrap}
.mchip{display:inline-flex;align-items:center;gap:2px;background:var(--chip);border-radius:999px;padding-left:14px;min-height:40px}
.mchip button{width:36px;height:36px;border:0;background:transparent;border-radius:50%;color:var(--mute)}
.empty{max-width:560px;margin:56px auto;text-align:center;padding:0 16px}.empty p{color:var(--mute)}.empty .inl{justify-content:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 18px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;z-index:20}
.toast button{min-height:40px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:700;padding:0 14px}
.toast button[hidden]{display:none}
.tabs{display:none}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}.flash{animation:pop .35s ease}
@media(prefers-reduced-motion:reduce){.flash{animation:none}}
@media(max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);padding-bottom:110px}.receipt{position:static}
  body[data-tab=in] #tList,body[data-tab=in] #tRc,body[data-tab=list] #tIn,body[data-tab=list] #tRc,body[data-tab=rc] #tIn,body[data-tab=rc] #tList{display:none}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
  .tabs button{min-height:52px;border:0;background:transparent;border-radius:12px;font-weight:700;color:var(--mute)}
  .tabs button[aria-current=true]{color:var(--acc);background:var(--chip)}
}
@media(max-width:600px){.gbar{width:100%;flex-wrap:nowrap}.gbar select{flex:1;max-width:none}.ghost{padding:0 10px;font-size:14px}.ex{grid-template-columns:minmax(0,1fr) auto auto}.ex .tag{display:none}.card{padding:14px}.row2{grid-template-columns:minmax(0,1fr)}.lhead .txt{max-width:none}}
</style>
</head>
<body data-tab="in">
<header class="top">
  <div class="in">
    <h1>모임 경비 정산</h1>
    <div class="gbar">
      <select id="gsel" aria-label="모임 선택"></select>
      <button class="ghost" id="bNew">+ 새 모임</button>
      <button class="ghost" id="bInv">초대</button>
      <button class="ghost" id="bSet">설정</button>
    </div>
  </div>
  <div class="sync" id="sync">불러오는 중…</div>
</header>

<div class="panel" id="pNew" hidden><div class="card">
  <h2>새 모임 만들기</h2>
  <label class="f" for="nName">모임 이름</label><input class="txt" id="nName" placeholder="예: 제주 2박 3일, 11월 정기모임">
  <label class="f" for="nMem">참여자 (쉼표나 띄어쓰기로 구분)</label><input class="txt" id="nMem" placeholder="예: 찐이, 민수, 지영, 현우">
  <div class="inl"><button class="btn" id="nOk">만들기</button><button class="btn light" id="nNo">닫기</button></div>
  <p class="hint" id="nHint"></p>
</div></div>

<div class="panel" id="pSet" hidden><div class="card">
  <h2>멤버·설정</h2>
  <label class="f" for="sName">모임 이름</label>
  <div class="inl" style="margin-top:0"><input class="txt" id="sName"><button class="btn light" id="sRen">이름 변경</button></div>
  <label class="f">멤버</label><div class="chips" id="sMem"></div>
  <div class="inl"><input class="txt" id="sAdd" placeholder="추가할 이름"><button class="btn" id="sAddB">추가</button></div>
  <p class="hint" id="sHint"></p>
  <div class="inl"><button class="btn light" id="sLeave">내 목록에서 빼기</button><button class="btn danger" id="sDel">모임 삭제 (모두에게서)</button><button class="btn light" id="sClose">닫기</button></div>
</div></div>

<div id="emptyV" class="empty" hidden>
  <h2 style="font-size:28px" id="eTitle">아직 모임이 없어요</h2>
  <p id="eMsg">모임이나 여행을 만들고, 식당에서 결제할 때마다 내 주변 장소를 골라 금액만 넣으세요. 누가 누구에게 얼마 보내면 되는지 자동으로 계산합니다.</p>
  <div class="inl"><button class="btn" id="eNew" style="background:var(--acc);color:#fff">+ 새 모임 만들기</button><button class="btn light" id="eDemo">예시 모임으로 둘러보기</button></div>
</div>

<main class="wrap" id="mainV" hidden>
  <div>
    <form class="card" id="tIn" autocomplete="off">
      <h2 id="fTitle">지출 입력</h2>
      <div class="plsel" id="plSel" hidden><div><b id="plSelN"></b><small id="plSelA"></small></div><button type="button" id="plClr" aria-label="장소 선택 해제">✕</button></div>
      <button type="button" class="plbtn" id="plOpen">내 주변 식당·장소 찾기</button>
      <div class="plpanel" id="plPanel" hidden>
        <div class="inl"><input class="txt" id="plQ" placeholder="식당·장소 이름 (예: 해장국, 스타벅스)" enterkeyhint="search"><button type="button" class="btn" id="plGo">검색</button><button type="button" class="btn light" id="plX" aria-label="장소 찾기 닫기">닫기</button></div>
        <div class="chips plcats" id="plCats"></div>
        <div class="map" id="plMap"><button type="button" class="me" id="plMe">현재 위치</button></div>
        <p class="hint" id="plHint"></p>
        <div class="res" id="plRes"></div>
      </div>
      <div class="amt"><input id="fAmt" inputmode="numeric" placeholder="0" aria-label="금액"><span>원</span></div>
      <div class="quick"><button type="button" data-q="1000">+1천</button><button type="button" data-q="10000">+1만</button><button type="button" data-q="50000">+5만</button><button type="button" data-q="0">지우기</button></div>
      <div class="row2">
        <div><label class="f" for="fTit">내용</label><input class="txt" id="fTit" placeholder="예: 흑돼지 저녁"></div>
        <div><label class="f" for="fDate">날짜</label><input class="txt" id="fDate" type="date"></div>
      </div>
      <label class="f">분류</label><div class="chips" id="fCat"></div>
      <label class="f">결제한 사람</label><div class="chips" id="fPay"></div>
      <label class="f">함께 쓴 사람 <span id="fCnt"></span></label><div class="chips" id="fAmong"></div>
      <div class="go"><button id="save" type="submit">저장</button><button id="cancel" type="button" hidden>취소</button></div>
      <p class="hint" id="fHint"></p>
    </form>

    <section id="tList" style="margin-top:24px">
      <div class="lhead"><h2 style="margin:0">지출 내역 <span id="lCnt" style="color:var(--mute);font-weight:500"></span></h2>
        <div class="inl"><input class="txt" id="q" placeholder="검색 (내용·장소·이름)"></div></div>
            <div id="lBody"></div>
    </section>
  </div>
  <aside class="receipt" id="tRc" aria-live="polite"></aside>
</main>

<nav class="tabs" id="tabs"><button data-t="in" aria-current="true">입력</button><button data-t="list">내역</button><button data-t="rc">정산</button></nav>
<div class="toast" id="toast" hidden><span id="tMsg"></span><button id="tUndo">되돌리기</button></div>

<script src="config.js"></script>
<script type="module">
const C=window.APP_CONFIG||{};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const won=n=>fmt(n)+'원';
const rid=(n=20)=>{const a='abcdefghijkmnpqrstuvwxyz23456789',b=new Uint8Array(n);crypto.getRandomValues(b);return[...b].map(x=>a[x%a.length]).join('')};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const clean=o=>JSON.parse(JSON.stringify(o));
const CATS=['식비','술·카페','숙박','교통','장보기','입장·체험','기타'];
const PCATS=[['FD6','음식점'],['CE7','카페'],['CS2','편의점'],['MT1','마트'],['AD5','숙박'],['AT4','관광명소'],['OL7','주유소'],['PK6','주차장']];
function mapCat(code,name=''){if(code==='FD6')return/술집|호프|포차|바\b|이자카야/.test(name)?'술·카페':'식비';if(code==='CE7')return'술·카페';if(code==='AD5')return'숙박';if(code==='CS2'||code==='MT1')return'장보기';if(code==='AT4'||code==='CT1')return'입장·체험';if(code==='OL7'||code==='PK6'||code==='SW8')return'교통';return null}

/* ---------- 저장소: Firebase(실시간 공유) 또는 이 기기(localStorage) ---------- */
function localStore(){const K='ms-local';let D=lsGet(K,{g:{},e:{}});const subs=new Set();const save=()=>{lsSet(K,D);subs.forEach(f=>f())};
  return{mode:'local',sub(gid,onG,onE){const f=()=>{onG(D.g[gid]?{...D.g[gid]}:null);onE({...(D.e[gid]||{})})};subs.add(f);f();return()=>subs.delete(f)},
    putGroup:async g=>{D.g[g.id]=clean(g);save()},putExp:async(gid,x)=>{(D.e[gid]=D.e[gid]||{})[x.id]=clean(x);save()},
    delExp:async(gid,id)=>{if(D.e[gid])delete D.e[gid][id];save()},delGroup:async gid=>{delete D.g[gid];delete D.e[gid];save()}}}
async function cloudStore(cfg){const V='10.12.2';
  const [{initializeApp},fs]=await Promise.all([import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);
  const d=fs.getFirestore(initializeApp(cfg));
  return{mode:'cloud',sub(gid,onG,onE,onErr){
      const u1=fs.onSnapshot(fs.doc(d,'groups',gid),s=>onG(s.exists()?{...s.data(),id:gid}:null),onErr);
      const u2=fs.onSnapshot(fs.collection(d,'groups',gid,'expenses'),s=>{const o={};s.forEach(x=>{const v=x.data();if(typeof v.amount==='number')o[x.id]={...v,id:x.id}});onE(o)},onErr);
      return()=>{u1();u2()}},
    putGroup:g=>fs.setDoc(fs.doc(d,'groups',g.id),clean(g)),

function settle(g,list){
  const m=g.members||[],paid={},owe={},cat={};let total=0;m.forEach(p=>{paid[p]=0;owe[p]=0});
  list.forEach(x=>{const am=(x.among||[]).filter(p=>p in owe);if(!am.length||!(x.payer in paid))return;total+=x.amount;paid[x.payer]+=x.amount;am.forEach(p=>owe[p]+=x.amount/am.length);const c=x.cat||'기타';cat[c]=(cat[c]||0)+x.amount});
  const unit=g.unit||1,cr=[],dr=[];m.forEach(p=>{const v=paid[p]-owe[p];if(v>0.5)cr.push({p,v});else if(v<-0.5)dr.push({p,v:-v})});
  cr.sort((a,b)=>b.v-a.v);dr.sort((a,b)=>b.v-a.v);const tr=[];let i=0,j=0;
  while(i<dr.length&&j<cr.length){const a=Math.min(dr[i].v,cr[j].v),r=Math.round(a/unit)*unit;if(r>0)tr.push({from:dr[i].p,to:cr[j].p,amt:r});dr[i].v-=a;cr[j].v-=a;if(dr[i].v<0.5)i++;if(cr[j].v<0.5)j++}
  return{m,paid,owe,tr,total,cat};
}

function search(kind,val){

$('#plQ').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#plGo').click()}});
$('#plMe').onclick=async()=>{if(!map)return;plHint('현재 위치 확인 중…');pos=await locate();if(!pos){plHint('위치를 가져오지 못했어요. 브라우저의 위치 권한을 허용해 주세요.',true);return}
  const ll=new K.maps.LatLng(pos.lat,pos.lng);map.setCenter(ll);map.setLevel(4);if(meMark)meMark.setMap(null);meMark=new K.maps.CustomOverlay({position:ll,content:'<div class="medot"></div>',zIndex:5});meMark.setMap(map);search('cat','FD6')};


/* ---------- 모임 만들기·설정·초대 ---------- */
const parseMem=s=>[...new Set(s.split(/[,\s、·]+/).map(t=>t.trim().slice(0,12)).filter(Boolean))].slice(0,30);
const openNew=()=>{$('#pNew').hidden=false;$('#pSet').hidden=true;$('#nHint').textContent='';$('#nName').focus()};
$('#bNew').onclick=openNew;$('#eNew').onclick=openNew;$('#nNo').onclick=()=>$('#pNew').hidden=true;
$('#nOk').onclick=async()=>{const name=$('#nName').value.trim(),m=parseMem($('#nMem').value);
  if(!name||m.length<2){$('#nHint').className='hint err';$('#nHint').textContent='모임 이름과 참여자 2명 이상을 넣어 주세요.';return}
  const g={id:rid(20),name:name.slice(0,40),members:m,unit:10,created:Date.now()};
  $('#pNew').hidden=true;$('#nName').value='';$('#nMem').value='';F.payer=null;upsertJoined(g);run(S.putGroup(g));openGroup(g.id)};
$('#eDemo').onclick=()=>{const g={id:rid(20),name:'제주 2박 3일 (예시)',members:['찐이','민수','지영','현우'],unit:10,created:Date.now()};upsertJoined(g);run(S.putGroup(g));
  const d=today(),X=[['렌터카 3일',186000,'민수','교통'],['흑돼지 저녁',148000,'찐이','식비'],['편의점 맥주·간식',32500,'지영','장보기'],['오션뷰 펜션 2박',420000,'찐이','숙박'],['카페 (현우 제외)',27000,'지영','술·카페',['찐이','민수','지영']],['우도 배편',42000,'현우','입장·체험']];
  X.forEach((s,k)=>run(S.putExp(g.id,{id:rid(16),title:s[0],amount:s[1],payer:s[2],cat:s[3],among:s[4]||[...g.members],date:d,place:null,ts:Date.now()+k})));F.payer=null;openGroup(g.id)};
function renderSet(){const g=group;if(!g)return;const used=new Set(gExps().flatMap(x=>[x.payer,...(x.among||[])]));
  $('#sMem').innerHTML=(g.members||[]).map((p,k)=>`<span class="mchip">${esc(p)}<button data-k="${k}" aria-label="${esc(p)} 빼기">✕</button></span>`).join('');
  $('#sMem').querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=g.members[+b.dataset.k];if(used.has(p)){$('#sHint').className='hint err';$('#sHint').textContent=`${p} 님이 들어간 지출이 있어 뺄 수 없어요. 해당 지출을 먼저 수정하세요.`;return}run(S.putGroup({...g,members:g.members.filter(x=>x!==p)}))})}
$('#bSet').onclick=()=>{const p=$('#pSet');p.hidden=!p.hidden;$('#pNew').hidden=true;if(!p.hidden){$('#sName').value=group.name;$('#sHint').textContent='';$('#sDel').dataset.arm='';$('#sDel').textContent='모임 삭제 (모두에게서)';$('#sLeave').hidden=S.mode!=='cloud';renderSet()}};
$('#sClose').onclick=()=>$('#pSet').hidden=true;
$('#sRen').onclick=()=>{const v=$('#sName').value.trim();if(v)run(S.putGroup({...group,name:v.slice(0,40)}))};
const addMem=()=>{const g=group,add=parseMem($('#sAdd').value).filter(x=>!g.members.includes(x));if(!add.length)return;$('#sAdd').value='';run(S.putGroup({...g,members:[...g.members,...add].slice(0,30)}));F.among=[...F.among,...add]};
$('#sAddB').onclick=addMem;$('#sAdd').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addMem()}});
$('#sLeave').onclick=()=>{$('#pSet').hidden=true;dropJoined(cur);closeGroup()};
$('#sDel').onclick=e=>{const b=e.currentTarget;if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='한 번 더 누르면 모든 멤버에게서 지출까지 삭제돼요';return}
  $('#pSet').hidden=true;const id=cur,ids=Object.keys(exps);dropJoined(id);run(S.delGroup(id,ids));closeGroup()};
$('#bInv').onclick=()=>{if(S.mode!=='cloud'){toast('이 기기 저장 모드예요. config.js에 Firebase를 설정하면 초대 링크로 함께 입력할 수 있어요.');return}
  const u=new URL(location.href);u.search='?g='+cur;u.hash='';shareText(`[${group.name}] 경비 같이 적어요\n${u}`,$('#bInv'))};

/* ---------- 시작 ---------- */
(async()=>{
  if(C.FIREBASE&&C.FIREBASE.projectId){try{S=await cloudStore(C.FIREBASE)}catch(e){console.error(e)}}
  if(!S){S=localStore();$('#sync').textContent=C.FIREBASE&&C.FIREBASE.projectId?'Firebase 연결 실패 — 이 기기에만 저장 중':'이 기기에만 저장 중 · Firebase를 설정하면 일행과 실시간 공유돼요'}
  else $('#sync').textContent='실시간 동기화 중 · 초대 링크를 받은 사람은 누구나 함께 입력할 수 있어요';
  const g=new URLSearchParams(location.search).get('g'),last=lsGet('ms-cur',null);
  if(g&&/^[a-z0-9]{8,40}$/.test(g))openGroup(g);else if(last&&joined.some(j=>j.id===last))openGroup(last);else if(joined[0])openGroup(joined[0].id);else render();
})();
</script>
</body>
</html>
